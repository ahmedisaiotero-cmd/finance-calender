# Isolated Postgres for Sync integration tests. Never point this at Neon.
services:
  sync-test-postgres:
    image: postgres:16-alpine
    container_name: sync-test-postgres
    environment:
      POSTGRES_USER: sync
      POSTGRES_PASSWORD: sync_test_only
      POSTGRES_DB: sync_test
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sync -d sync_test"]
      interval: 2s
      timeout: 5s
      retries: 20
